name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        shell: bash
        run: |
          npm install -g pnpm@10.26.2
          pnpm config set auto-install-peers true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: release_notes
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.VERSION }}"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "## AiMaMi ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Security-hardened fork release by TurnX-alt." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Security Patches" >> "$GITHUB_OUTPUT"
          echo "- CSP policy enforced (restrictive default-src 'self')" >> "$GITHUB_OUTPUT"
          echo "- Dependency versions pinned for Tauri compatibility" >> "$GITHUB_OUTPUT"
          echo "- Updater signing key rotation" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Upstream" >> "$GITHUB_OUTPUT"
          echo "- Based on borawong/AiMaMi v$VERSION" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AiMaMi ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false

  publish-release:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false --latest
